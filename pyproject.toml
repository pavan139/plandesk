[project]
name = "plandesk"
version = "0.1.0"
description = "Grounded, year-aware answers on U.S. retirement-plan rules from IRS publications, with verified citations, abstention and evals"
readme = "README.md"
authors = [
    { name = "Pavan Reddy Mogili" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "fonttools>=4.68.0",
    "numpy>=2.5.5",
    "openai>=3.51.0",
    "pypdf>=7.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
plandesk = "plandesk.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
